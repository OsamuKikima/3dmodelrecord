<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モデログ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer></script>
<style>
  :root{
    --bg:#fff8ef; --surface:#ffffff; --surface-alt:#fff0da; --border:#f2ddb8;
    --text:#241c3d; --text-muted:#6b6089;
    --accent:#6c5ce7; --accent-soft:#ece7fd; --accent-contrast:#ffffff;
    --warm:#ff9f1c; --warm-soft:#fff0da;
    --good:#17b978; --good-soft:#dcf7ea;
    --danger:#ff4757; --danger-soft:#ffe3e6;
    --shadow:0 2px 5px rgba(108,92,231,.09), 0 10px 28px rgba(108,92,231,.14);
    --radius-s:9px; --radius-m:16px; --radius-l:22px;
    --font-display:'Shippori Mincho B1', 'Hiragino Mincho ProN', serif;
    --font-body:'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1625; --surface:#241e38; --surface-alt:#2e2748; --border:#463a68;
      --text:#f3eeff; --text-muted:#b6abda;
      --accent:#a78bfa; --accent-soft:#362a5c; --accent-contrast:#1a1625;
      --warm:#ffb454; --warm-soft:#45341c;
      --good:#4ade80; --good-soft:#1c3a2c;
      --danger:#ff6b6f; --danger-soft:#412129;
      --shadow:0 2px 5px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1a1625; --surface:#241e38; --surface-alt:#2e2748; --border:#463a68;
    --text:#f3eeff; --text-muted:#b6abda;
    --accent:#a78bfa; --accent-soft:#362a5c; --accent-contrast:#1a1625;
    --warm:#ffb454; --warm-soft:#45341c;
    --good:#4ade80; --good-soft:#1c3a2c;
    --danger:#ff6b6f; --danger-soft:#412129;
    --shadow:0 2px 5px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); line-height:1.6;
    padding-inline:16px;
  }
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:5px; z-index:100;
    background:linear-gradient(90deg, var(--accent), var(--warm), var(--good), var(--danger), var(--accent));
    background-size:200% 100%;
    animation:molGradientShift 10s linear infinite;
  }
  @keyframes molGradientShift{ from{background-position:0% 0;} to{background-position:200% 0;} }
  @media (prefers-reduced-motion:reduce){ body::before{animation:none;} }
  h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s);}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  ::selection{background:var(--accent-soft);}

  #shell{max-width:920px; margin:0 auto; padding-block:26px 60px;}

  .masthead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .masthead .sub{font-family:var(--font-mono); font-size:12px; color:var(--text-muted); letter-spacing:.04em;}
  .manual-link{display:inline-block; margin-top:6px; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--accent);}
  .manual-link:hover{text-decoration:underline;}
  .lang-toggle{border:1px solid var(--border); background:var(--surface); border-radius:99px; padding:3px 11px; font-size:11.5px; font-weight:700; color:var(--text-muted); font-family:var(--font-mono); letter-spacing:.03em; margin-top:6px;}
  .lang-toggle:hover{border-color:var(--accent); color:var(--accent);}

  .club-banner{
    display:inline-flex; align-items:center; gap:10px;
    background:linear-gradient(90deg, var(--accent-soft), var(--warm-soft));
    border:1px solid var(--border); border-radius:var(--radius-l);
    padding:7px 16px 7px 8px; margin:8px 0 8px;
  }
  .club-icon{width:32px; height:32px; flex-shrink:0;}
  .club-banner-text{display:flex; flex-direction:column; gap:1px;}
  .club-banner .club-text{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--text); letter-spacing:.02em; margin:0; line-height:1.2;}
  .wordmark{font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:.04em; line-height:1; display:inline-flex; align-items:baseline;}
  .wm-model{color:var(--accent);}
  .wm-log{color:var(--warm);}
  .wm-l{color:var(--good); font-weight:800; position:relative; padding:0 .5px;}
  .wm-l::after{content:""; position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--good);}

  nav.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:20px; border-bottom:1px solid var(--border);}
  nav.tabs button{
    background:none; border:none; padding:10px 14px; font-size:14px; color:var(--text-muted);
    white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; position:relative;
    display:flex; align-items:center; gap:6px;
  }
  nav.tabs button.is-active{color:var(--accent); border-bottom-color:var(--accent); border-bottom-width:3px; font-weight:700;}
  nav.tabs .badge{background:var(--danger); color:#fff; font-family:var(--font-mono); font-size:11px; padding:1px 6px; border-radius:99px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow); transition:transform .16s ease, box-shadow .16s ease;}
  .panel{padding:20px;}
  .stack{display:flex; flex-direction:column; gap:16px;}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .row.between{justify-content:space-between;}

  .btn{border-radius:var(--radius-s); padding:9px 16px; font-size:14px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text); transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease, opacity .14s ease;}
  .btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent);}
  .btn-primary:hover{opacity:.94; box-shadow:0 6px 16px rgba(108,92,231,.32);}
  .btn-secondary{background:transparent;}
  .btn-danger-text{background:none; border:none; color:var(--danger); font-size:12px; text-decoration:underline; padding:2px 4px;}
  .btn-danger{background:var(--danger); color:#fff; border-color:var(--danger);}
  .btn-danger:hover{opacity:.9; box-shadow:0 6px 16px rgba(255,71,87,.3);}
  .btn-danger-outline{background:transparent; color:var(--danger); border-color:var(--danger);}
  .danger-zone{border-top:1px solid var(--border); padding-top:14px; margin-top:4px;}
  .badge-private{display:inline-block; font-size:11px; font-weight:600; color:var(--text-muted); background:var(--surface-alt); border-radius:99px; padding:2px 9px; vertical-align:middle;}
  .badge-theme{display:inline-block; font-size:11px; font-weight:600; color:var(--accent-contrast); background:var(--accent); border-radius:99px; padding:2px 9px; vertical-align:middle;}
  .badge-video{display:inline-block; font-size:11px; font-weight:600; color:#fff; background:var(--good); border-radius:99px; padding:2px 9px; vertical-align:middle;}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
  .chip-btn{border:1px solid var(--border); background:var(--surface); border-radius:99px; padding:6px 13px; font-size:13px; color:var(--text-muted); transition:transform .14s ease, border-color .14s ease;}
  .chip-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .chip-btn.is-active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:700;}
  .icon-btn{background:none; border:none; font-size:20px; line-height:1; color:var(--text-muted); padding:2px 6px;}

  .notice{background:var(--warm-soft); border:1px solid var(--warm); color:var(--text); border-radius:var(--radius-m); padding:14px 16px; font-size:14px;}
  .notice.error{background:var(--danger-soft); border-color:var(--danger);}

  label.field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--text-muted); font-weight:500;}
  label.field input, label.field textarea, label.field select{padding:9px 11px; font-size:14px; color:var(--text);}
  label.field input:invalid{border-color:var(--danger);}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){ .field-grid{grid-template-columns:1fr;} }

  .section-title{font-size:15px; font-weight:700; color:var(--text); margin-bottom:2px;}
  .section-hint{font-size:12.5px; color:var(--text-muted); margin-bottom:8px;}

  .slot-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
  .slot-card{border:1.5px dashed var(--border); border-radius:var(--radius-m); overflow:hidden; background:var(--surface-alt); min-height:150px; display:flex; flex-direction:column;}
  .slot-card.has-photo{border-style:solid; background:var(--surface);}
  .slot-label{font-size:12px; font-weight:700; padding:7px 9px; color:var(--text-muted); font-family:var(--font-mono); letter-spacing:.03em;}
  .slot-label-input{margin:7px 8px 0; border:none; border-bottom:1.5px dashed var(--border); border-radius:0; background:transparent; font-size:12px; font-weight:700; padding:2px 3px 5px; color:var(--text); font-family:var(--font-mono);}
  .slot-label-input:focus-visible{outline:none; border-bottom-color:var(--accent);}
  .slot-label-input::placeholder{color:var(--text-muted); font-weight:500;}
  .slot-empty-btn{flex:1; background:none; border:none; color:var(--text-muted); font-size:13px; display:flex; align-items:center; justify-content:center; padding:16px;}
  .slot-thumb-wrap{position:relative; aspect-ratio:4/3; overflow:hidden;}
  .slot-thumb-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .slot-pin-count{position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:2px 7px; border-radius:99px; font-family:var(--font-mono);}
  .slot-actions{display:flex; gap:6px; padding:7px 9px; border-top:1px solid var(--border);}
  .slot-actions button{flex:1; font-size:12px; padding:6px 4px;}

  .action-rows{display:flex; flex-direction:column; gap:8px;}
  .action-row{display:flex; gap:8px; align-items:center;}
  .action-row input{flex:1;}

  /* photo stage (shared by annotate modal + detail view) */
  .photo-stage{position:relative; width:100%; border-radius:var(--radius-m); overflow:hidden; background:var(--surface-alt); line-height:0;}
  .photo-stage img{width:100%; display:block; user-select:none;}
  .pin-layer{position:absolute; inset:0;}
  .arrow-layer{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .rel-line{stroke:var(--accent); stroke-width:.6; fill:none; pointer-events:stroke; cursor:pointer;}
  .pin-marker{position:absolute; transform:translate(-50%,-50%); width:22px; height:22px; border:none; background:none; padding:0; cursor:pointer;}
  .pin-dot{display:block; width:100%; height:100%; border-radius:50% 50% 50% 0; background:var(--warm); border:2px solid var(--accent-contrast); transform:rotate(-45deg); box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .pin-marker.is-selected .pin-dot{background:var(--accent); outline:2px solid var(--accent-contrast);}
  .pin-marker:hover .pin-dot{filter:brightness(1.1);}

  .annotate-toolbar{display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap;}
  .hint{font-size:12.5px; color:var(--text-muted); margin:0 0 10px;}
  .annotate-lists{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
  @media (max-width:560px){ .annotate-lists{grid-template-columns:1fr;} }
  .annotate-lists h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px;}
  .rec-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto;}
  .rec-list li{background:var(--surface-alt); border-radius:var(--radius-s); padding:7px 9px; font-size:13px; position:relative; padding-right:52px;}
  .rec-list li b{display:block;}
  .rec-list li span{color:var(--text-muted); font-size:12.5px;}
  .rec-list li button{position:absolute; right:8px; top:8px;}
  .rec-list li.empty{color:var(--text-muted); font-style:italic; padding-right:9px;}

  /* modals */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,17,12,.5); display:flex; align-items:flex-start; justify-content:center; padding:min(6vh,40px) 16px; overflow-y:auto; z-index:50;}
  .modal-overlay-top{z-index:60;}
  .modal{background:var(--bg); border-radius:var(--radius-l); width:100%; max-width:640px; box-shadow:var(--shadow); padding:20px;}
  .small-modal{max-width:400px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .form-body{display:flex; flex-direction:column; gap:12px;}
  .field-checkbox{flex-direction:row; align-items:center; gap:8px;}
  .field-checkbox input{width:auto;}

  /* calendar */
  .cal-head{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;}
  .cal-head .cal-title{font-family:var(--font-display); font-size:19px; font-weight:600; min-width:130px; text-align:center;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--text-muted); font-weight:700; padding-bottom:4px;}
  .cal-cell{aspect-ratio:1/1; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface); padding:4px; font-size:12px; display:flex; flex-direction:column; gap:2px; overflow:hidden; text-align:left;}
  .cal-cell.is-outside{opacity:.35; background:transparent; border-style:dashed;}
  .cal-cell.is-today{border-color:var(--accent); border-width:2px;}
  .cal-cell.is-selected{background:var(--accent-soft);}
  .cal-daynum{font-family:var(--font-mono); font-weight:600;}
  .cal-dot{width:6px; height:6px; border-radius:50%; background:var(--warm); display:inline-block; margin-right:3px;}
  .cal-chip{font-size:10px; background:var(--warm-soft); color:var(--text); border-radius:4px; padding:0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cal-day-list{margin-top:16px;}

  /* list & cards of models */
  .model-card{display:flex; gap:14px; padding:14px; cursor:pointer;}
  .model-card:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 10px rgba(108,92,231,.12), 0 14px 30px rgba(108,92,231,.16);}
  .model-thumb{width:88px; height:66px; border-radius:var(--radius-s); overflow:hidden; flex-shrink:0; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:11px;}
  .model-thumb img{width:100%; height:100%; object-fit:cover;}
  .model-card .meta{font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono);}
  .model-card h3{font-size:16px; font-weight:600; margin-bottom:2px;}

  .empty-state{text-align:center; padding:40px 16px; color:var(--text-muted);}

  /* detail */
  .detail-meta{display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--text-muted); font-family:var(--font-mono);}
  .toggle-row{display:flex; align-items:center; gap:8px; font-size:13px;}
  .photo-gallery{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:0;}
  .photo-block{margin:0;}
  .photo-block figcaption{font-size:12px; color:var(--text-muted); margin-top:6px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .photo-block figcaption span{font-weight:700; color:var(--text);}
  .video-embed-wrap{position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--radius-m); overflow:hidden; background:var(--surface-alt);}
  .video-embed-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

  /* cube viewer */
  .cube-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .cube-scene{--size:min(66vw,300px); width:var(--size); height:var(--size); perspective:900px; touch-action:none; cursor:grab;}
  .cube-scene:active{cursor:grabbing;}
  .cube{position:relative; width:100%; height:100%; transform-style:preserve-3d;}
  .cube-face{position:absolute; width:var(--size); height:var(--size); overflow:hidden; background:var(--surface-alt); border:1px solid var(--border);}
  .cube-face .photo-stage{position:absolute; inset:0; border-radius:0;}
  .cube-face .photo-stage img{width:100%; height:100%; object-fit:cover;}
  .cube-face-label{position:absolute; top:6px; left:8px; z-index:2; font-size:11px; font-family:var(--font-mono); background:rgba(0,0,0,.55); color:#fff; padding:2px 7px; border-radius:99px; pointer-events:none;}
  .cube-face-empty{display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-muted); font-size:12px; text-align:center; padding:10px;}
  .face-front{ transform: translateZ(calc(var(--size)/2)); }
  .face-back{ transform: rotateY(180deg) translateZ(calc(var(--size)/2)); }
  .face-right{ transform: rotateY(90deg) translateZ(calc(var(--size)/2)); }
  .face-left{ transform: rotateY(-90deg) translateZ(calc(var(--size)/2)); }
  .face-top{ transform: rotateX(90deg) translateZ(calc(var(--size)/2)); }
  .cube-hint{font-size:12.5px; color:var(--text-muted);}
  .slot-strip{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .slot-strip-item{display:flex; align-items:center; gap:8px; background:var(--surface-alt); border-radius:var(--radius-s); padding:6px 8px 6px 6px;}
  .slot-strip-item img{width:34px; height:34px; object-fit:cover; border-radius:6px;}
  .slot-strip-item span{font-size:12px; color:var(--text-muted);}
  .slot-strip-item button{font-size:11.5px; padding:4px 8px;}

  .action-card{border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; background:var(--surface-alt);}
  .action-card .action-text{font-weight:600; margin-bottom:2px;}
  .action-card .meta{font-size:12px; color:var(--text-muted); font-family:var(--font-mono); margin-bottom:10px;}
  .check-row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  @media (max-width:560px){ .check-row{grid-template-columns:repeat(2,1fr);} }
  .check-chip{background:var(--surface); border-radius:var(--radius-s); padding:8px; font-size:12px; display:flex; flex-direction:column; gap:4px;}
  .check-chip-label{font-weight:700; color:var(--text-muted); font-size:11px;}
  .check-chip.good{background:var(--good-soft);}
  .check-chip.danger{background:var(--danger-soft);}
  .check-chip button{font-size:11px; padding:4px 6px; border-radius:6px;}
  .check-comment{font-size:11.5px; color:var(--text-muted); margin:0;}

  .due-item{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-m); background:var(--danger-soft); flex-wrap:wrap;}
  .due-item .info{font-size:13px;}
  .due-item .info b{display:block; font-size:14.5px;}
  .upcoming-item{display:flex; justify-content:space-between; padding:9px 14px; font-size:13px; border-bottom:1px solid var(--border);}
  .upcoming-item:last-child{border-bottom:none;}

  .sync-note{font-family:var(--font-mono); font-size:11px; color:var(--text-muted); text-align:right; margin-bottom:6px;}
  #globalNotice:empty{display:none;}
  #globalNotice .notice{margin-bottom:16px;}
  .user-bar{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted);}
  .user-bar b{color:var(--text);}
  .user-bar button{font-size:12px; padding:5px 11px;}
  .auth-card{max-width:420px; margin:32px auto;}
  .auth-tabs{display:flex; justify-content:center; gap:6px;}
  #recaptchaContainer{display:flex; justify-content:center;}

  /* 特別な記録帳: 記録数の推移グラフ */
  .medal-chart-card{position:relative;}
  .medal-chart-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .medal-chart-total{font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted);}
  .medal-chart-total b{color:var(--accent); font-size:15px;}
  .medal-chart-wrap{position:relative;}
  .medal-chart-svg{display:block; width:100%; height:auto;}
  .medal-chart-grid line{stroke:var(--border);}
  .medal-chart-axis-label{font-family:var(--font-mono); font-size:10px; fill:var(--text-muted);}
  .medal-chart-area{fill:var(--accent-soft); opacity:.7;}
  .medal-chart-line{fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  .medal-chart-dot{fill:var(--surface); stroke:var(--accent); stroke-width:2;}
  .medal-chart-crosshair{stroke:var(--text-muted); stroke-width:1; stroke-dasharray:3 3; opacity:0; pointer-events:none;}
  .medal-chart-hoverdot{fill:var(--accent); stroke:var(--surface); stroke-width:2; opacity:0; pointer-events:none;}
  .medal-chart-hitrect{fill:transparent; cursor:crosshair;}
  .medal-chart-tooltip{
    position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
    background:var(--text); color:var(--bg); border-radius:var(--radius-s); padding:5px 9px;
    font-size:12px; font-family:var(--font-mono); white-space:nowrap; box-shadow:var(--shadow); z-index:2;
    transition:opacity .1s ease;
  }
  .medal-chart-empty{font-size:13.5px; color:var(--text-muted); padding:18px 4px; text-align:center;}

  /* 特別な記録帳(メダル) */
  .medal-progress{font-size:13.5px; color:var(--text-muted);}
  .medal-progress b{color:var(--text);}
  .medal-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:16px 10px; text-align:center;}
  .medal-card{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .medal{
    width:60px; height:60px; border-radius:50%; position:relative;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:800; font-size:12.5px; color:#fff;
    box-shadow:0 2px 3px rgba(0,0,0,.16), inset 0 -3px 0 rgba(0,0,0,.16);
  }
  .medal.tier-bronze{background:linear-gradient(150deg, #e3a06a, #a8672a);}
  .medal.tier-silver{background:linear-gradient(150deg, #dde3ea, #939ba6);}
  .medal.tier-gold{background:linear-gradient(150deg, #ffdd80, #d19a1d);}
  .medal.tier-platinum{background:linear-gradient(150deg, #c9b6ff, #7c4fe0); box-shadow:0 2px 3px rgba(0,0,0,.16), inset 0 -3px 0 rgba(0,0,0,.2), 0 0 0 3px var(--accent-soft);}
  .medal.is-locked{background:var(--surface-alt); color:var(--text-muted); box-shadow:none; border:1.5px dashed var(--border);}
  .medal-star{position:absolute; top:-5px; right:-3px; width:20px; height:20px;}
  .medal-label{font-size:12px; font-weight:700; color:var(--text);}
  .medal-card.is-locked .medal-label{color:var(--text-muted); font-weight:600;}
  .medal-date{font-size:10.5px; color:var(--text-muted); font-family:var(--font-mono);}
  .medal-celebration{text-align:center;}
  .medal-celebration .medal{width:88px; height:88px; font-size:17px; margin:6px auto 14px;}
  .medal-celebration .medal-star{width:28px; height:28px; top:-8px; right:-6px;}

  @media (max-width:480px){ .field-grid{grid-template-columns:1fr;} .annotate-lists{grid-template-columns:1fr;} }
</style>

  function pad(n){ return String(n).padStart(2,'0'); }

  function addDays(dateStr,n){ var d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function addMonths(dateStr,n){ var d=new Date(dateStr+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

    if(c.due <= todayStr()) return {text:t('check_status_due'), cls:'danger'};
    return {text:t('check_status_upcoming',{date:c.due}), cls:''};
  }

    if(action.stopped) return [];

    });

  /* ---------- API layer (Google Apps Script backend) ----------
     注意: Google Apps ScriptのウェブアプリはCORSヘッダーを返さないため、
     通常のfetch()では外部ドメイン(GitHub Pagesなど)から呼び出せない
     (ブラウザのCORSポリシーでブロックされる)。そのため、隠しiframe+
     隠しフォームでPOST送信し、Code.gs側からはHTML内のpostMessageで
     結果を返す方式を使う(フォーム送信・postMessageはどちらもCORSの
     対象外なので、これで確実に動く)。
     ========================================================= */
  // 実測したところ、この隠しiframe+フォーム方式は複数のAPI呼び出しを同時に
  // (Promise.allなどで並行して)実行すると、呼び出しごとに別々のiframeを
  // 使っていても応答が届かず全滅する(Apps Script側のexec URLラッパーが
  // 同時多重読み込みを想定していない模様)。1件ずつ順番に実行すれば確実に
  // 動くため、apiCall自体の中でリクエストを直列化するキューを持たせ、
  // 呼び出し側(Promise.allで複数書き込みをまとめて投げる箇所など)を
  // 直す必要がないようにする。
  var apiCallQueueTail = Promise.resolve();
  function apiCall(action, payload){
    if(!API_URL){
      return Promise.reject(new Error(t('err_api_url_unset')));
    }
    var run = function(){ return apiCallSingle(action, payload); };
    var result = apiCallQueueTail.then(run, run);
    apiCallQueueTail = result.then(function(){}, function(){});
    return result;
  }
  function apiCallSingle(action, payload){
    var body = Object.assign({action:action, token: session ? session.token : ''}, payload || {});
    var requestId = 'r' + Date.now() + '_' + Math.random().toString(36).slice(2);
    return new Promise(function(resolve, reject){
      var iframeName = 'apiFrame_' + requestId;
      var iframe = document.createElement('iframe');
      iframe.name = iframeName;
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      var form = document.createElement('form');
      form.method = 'POST';
      form.target = iframeName;
      form.action = API_URL;
      form.style.display = 'none';
      var inputPayload = document.createElement('input');
      inputPayload.type = 'hidden'; inputPayload.name = 'payload'; inputPayload.value = JSON.stringify(body);
      var inputReqId = document.createElement('input');
      inputReqId.type = 'hidden'; inputReqId.name = 'requestId'; inputReqId.value = requestId;
      form.appendChild(inputPayload);
      form.appendChild(inputReqId);
      document.body.appendChild(form);

      var settled = false;
      var timer = null;
      function cleanup(){
        window.removeEventListener('message', handler);
        if(timer) clearTimeout(timer);
        if(form.parentNode) form.parentNode.removeChild(form);
        if(iframe.parentNode) iframe.parentNode.removeChild(iframe);
      }
      function handler(ev){
        var data = ev.data;
        if(!data || typeof data !== 'object' || data.requestId !== requestId) return;
        if(settled) return;
        settled = true;
        cleanup();
        var json = data.result;
        if(!json || json.ok !== true){
          var msg = (json && json.error) || t('err_api_generic');
          if(msg.indexOf('AUTH_REQUIRED:') === 0){
            forceLogout();
            msg = msg.slice('AUTH_REQUIRED:'.length);
          }
          reject(new Error(serverMsg(msg)));
          return;
        }
        resolve(json.data);
      }
      window.addEventListener('message', handler);
      timer = setTimeout(function(){
        if(settled) return;
        settled = true;
        cleanup();
        reject(new Error(t('err_no_response')));
      }, 45000);

      try{
        form.submit();
      }catch(err){
        if(!settled){ settled = true; cleanup(); reject(err); }
      }
    });
  }
  function forceLogout(){
    session = null;
    try{ localStorage.removeItem('mol_session'); }catch(e){}
    currentView = 'list';
    authMode = 'login';
    authError = t('err_session_expired');
    renderApp();
  }
  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var result = String(reader.result);
        resolve(result.substring(result.indexOf(',')+1));
      };
      reader.onerror = function(){ reject(reader.error); };
      reader.readAsDataURL(file);
    });
  }
  async function apiUploadImage(file){
    var base64 = await fileToBase64(file);
    return apiCall('uploadImage', {base64:base64, filename:file.name, mimeType:file.type || 'image/jpeg'});
  }

  function afterAuthRender(){
    var focusEl = document.getElementById('auth-username') || document.getElementById('auth-forgot-email') || document.getElementById('auth-newpassword');
    if(focusEl) focusEl.focus();
    Array.prototype.forEach.call(document.querySelectorAll('#view input'), function(el){
      el.addEventListener('keydown', function(e){
        if(e.key !== 'Enter') return;
        e.preventDefault();
        if(authMode==='login') doLogin();
        else if(authMode==='register') doRegister();
        else if(authMode==='forgot') doRequestPasswordReset();
        else if(authMode==='reset') doResetPassword();
      });
    });
    if(authMode === 'register'){
      recaptchaWidgetId = null;
      renderRecaptchaIfNeeded();
    }
  }
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  async function doLogin(){
    var username = document.getElementById('auth-username').value.trim();
    var password = document.getElementById('auth-password').value;
    if(!username || !password){ authError=t('err_login_required'); renderApp(); return; }
    authBusy = true; authError=''; authSuccess=''; renderApp();
    try{
      var data = await apiCall('login', {username:username, password:password});
      session = data; persistSession();
      authBusy = false; currentView = 'list';
      renderApp();
      refreshData(false);
    }catch(e){
      authBusy = false; authError = serverMsg(e.message); renderApp();
    }
  }
  async function doRegister(){
    var username = document.getElementById('auth-username').value.trim();
    var displayName = document.getElementById('auth-displayname').value.trim();
    var password = document.getElementById('auth-password').value;
    var password2 = document.getElementById('auth-password2').value;
    if(!username || !password){ authError=t('err_login_required'); renderApp(); return; }
    if(!EMAIL_RE.test(username)){ authError=t('err_email_format'); renderApp(); return; }
    if(password.length < 6){ authError=t('err_password_min'); renderApp(); return; }
    if(password !== password2){ authError=t('err_password_mismatch'); renderApp(); return; }
    var token = (window.grecaptcha && recaptchaWidgetId!==null) ? grecaptcha.getResponse(recaptchaWidgetId) : '';
    if(RECAPTCHA_SITE_KEY && !token){ authError=t('err_recaptcha_required'); renderApp(); return; }
    authBusy = true; authError=''; authSuccess=''; renderApp();
    try{
      var data = await apiCall('register', {username:username, password:password, displayName:displayName, recaptchaToken:token});
      session = data; persistSession();
      authBusy = false; currentView = 'list';
      renderApp();
      refreshData(false);
    }catch(e){
      authBusy = false; authError = serverMsg(e.message);
      if(window.grecaptcha && recaptchaWidgetId!==null) grecaptcha.reset(recaptchaWidgetId);
      renderApp();
    }
  }
  async function doRequestPasswordReset(){
    var emailEl = document.getElementById('auth-forgot-email');
    var email = emailEl ? emailEl.value.trim() : '';
    if(!email){ authError=t('err_email_required'); renderApp(); return; }
    authBusy = true; authError=''; authSuccess=''; renderApp();
    try{
      await apiCall('requestPasswordReset', {email:email});
      authBusy = false;
      authSuccess = t('msg_reset_email_sent');
      renderApp();
    }catch(e){
      authBusy = false; authError = serverMsg(e.message); renderApp();
    }
  }
  async function doResetPassword(){
    var pw = document.getElementById('auth-newpassword').value;
    var pw2 = document.getElementById('auth-newpassword2').value;
    if(!pw || !pw2){ authError=t('err_new_password_required'); renderApp(); return; }
    if(pw.length < 6){ authError=t('err_password_min'); renderApp(); return; }
    if(pw !== pw2){ authError=t('err_password_mismatch'); renderApp(); return; }
    authBusy = true; authError=''; authSuccess=''; renderApp();
    try{
      await apiCall('resetPassword', {token:resetToken, newPassword:pw});
      authBusy = false;
      resetToken = '';
      try{
        var url = new URL(window.location.href);
        url.searchParams.delete('reset');
        window.history.replaceState({}, '', url.toString());
      }catch(e){}
      authMode = 'login';
      authSuccess = t('msg_password_reset_done');
      renderApp();
    }catch(e){
      authBusy = false; authError = serverMsg(e.message); renderApp();
    }
  }

  /* ---------- generic form dialog ---------- */
  function openFormDialog(opts){
    var fields = opts.fields || [];
    var ov = document.createElement('div');
    ov.className = 'modal-overlay modal-overlay-top';
    var fieldsHtml = fields.map(function(f){
      if(f.type === 'checkbox'){
        return '<label class="field field-checkbox"><input type="checkbox" name="'+f.key+'" '+(f.value?'checked':'')+' /><span>'+escapeHtml(f.label)+'</span></label>';
      }
      if(f.type === 'select'){
        var opts2 = (f.options||[]).map(function(o){ return '<option value="'+o+'" '+(String(o)===String(f.value)?'selected':'')+'>'+o+'</option>'; }).join('');
        return '<label class="field"><span>'+escapeHtml(f.label)+'</span><select name="'+f.key+'">'+opts2+'</select></label>';
      }
      if(f.type === 'textarea'){
        return '<label class="field"><span>'+escapeHtml(f.label)+'</span><textarea name="'+f.key+'" rows="3" '+(opts.readonly?'readonly':'')+'>'+escapeHtml(f.value||'')+'</textarea></label>';
      }
      return '<label class="field"><span>'+escapeHtml(f.label)+'</span><input type="text" name="'+f.key+'" value="'+escapeHtml(f.value||'')+'" '+(opts.readonly?'readonly':'')+'/></label>';
    }).join('');
    ov.innerHTML =
      '<div class="modal small-modal">'+
        '<div class="modal-head"><h3>'+escapeHtml(opts.title||'')+'</h3><button class="icon-btn" data-x>&times;</button></div>'+
        '<form class="form-body">'+ fieldsHtml +
          '<div class="modal-foot">'+
            (opts.readonly ? '<button type="button" class="btn btn-secondary" data-close>'+t('dialog_close')+'</button>' : '<button type="submit" class="btn btn-primary">'+t('dialog_save')+'</button>')+
          '</div>'+
        '</form>'+
      '</div>';
    document.body.appendChild(ov);
    ov.querySelector('[data-x]').onclick = function(){ ov.remove(); };
    var closeBtn = ov.querySelector('[data-close]');
    if(closeBtn) closeBtn.onclick = function(){ ov.remove(); };
    ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
    var form = ov.querySelector('form');
    if(!opts.readonly){
      form.onsubmit = function(e){
        e.preventDefault();
        var vals = {};
        fields.forEach(function(f){
          var el = form.elements[f.key];
          vals[f.key] = f.type === 'checkbox' ? el.checked : el.value;
        });
        ov.remove();
        opts.onSubmit && opts.onSubmit(vals);
      };
      var firstInput = form.querySelector('input[type=text],textarea');
      if(firstInput) firstInput.focus();
    }
  }

  /* ---------- annotate modal ---------- */
  function openAnnotateModal(cfg){
    var localPins = JSON.parse(JSON.stringify(cfg.pins || []));
    var localRelations = JSON.parse(JSON.stringify(cfg.relations || []));
    var mode = 'view';
    var relFirstId = null;
    var editable = !!cfg.editable;

    var ov = document.createElement('div');
    ov.className = 'modal-overlay';
    document.body.appendChild(ov);

    function modeHint(){
      if(mode === 'pin') return t('annotate_hint_pin');
      if(mode === 'relation') return relFirstId ? t('annotate_hint_relation_second') : t('annotate_hint_relation_first');
      return t('annotate_hint_view');
    }

    function pinMarkerHtml(p){
      return '<button type="button" class="pin-marker'+(relFirstId===p.id?' is-selected':'')+'" data-pin-id="'+p.id+'" style="left:'+p.x+'%;top:'+p.y+'%" title="'+escapeHtml(p.name)+'"><span class="pin-dot"></span></button>';
    }
    function svgHtml(){
      var lines = localRelations.map(function(r){
        var a = localPins.filter(function(p){return p.id===r.fromPinId;})[0];
        var b = localPins.filter(function(p){return p.id===r.toPinId;})[0];
        if(!a || !b) return '';
        return '<line class="rel-line" data-rel-id="'+r.id+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" marker-end="url(#arrow-'+cfg.slot+')"></line>';
      }).join('');
      return '<defs><marker id="arrow-'+cfg.slot+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs>'+lines;
    }

    function render(){
      ov.innerHTML =
        '<div class="modal">'+
          '<div class="modal-head"><h3>'+t('annotate_title',{label:escapeHtml(cfg.label)})+'</h3><button class="icon-btn" data-x>&times;</button></div>'+
          (editable ?
            '<div class="annotate-toolbar">'+
              '<button type="button" class="chip-btn'+(mode==='pin'?' is-active':'')+'" data-mode="pin">'+t('annotate_add_pin')+'</button>'+
              '<button type="button" class="chip-btn'+(mode==='relation'?' is-active':'')+'" data-mode="relation">'+t('annotate_add_relation')+'</button>'+
              '<button type="button" class="chip-btn'+(mode==='view'?' is-active':'')+'" data-mode="view">'+t('annotate_deselect')+'</button>'+
            '</div><p class="hint">'+modeHint()+'</p>' : '<p class="hint">'+modeHint()+'</p>') +
          '<div class="photo-stage" data-stage>'+
            '<img src="'+cfg.imgSrc+'" alt="'+escapeHtml(cfg.label)+'" draggable="false" />'+
            '<div class="pin-layer">'+localPins.map(pinMarkerHtml).join('')+'</div>'+
            '<svg class="arrow-layer" viewBox="0 0 100 100" preserveAspectRatio="none">'+svgHtml()+'</svg>'+
          '</div>'+
          '<div class="annotate-lists">'+
            '<div><h4>'+t('annotate_parts_heading',{n:localPins.length})+'</h4><ul class="rec-list">'+
              (localPins.length ? localPins.map(function(p){
                return '<li><b>'+escapeHtml(p.name)+'</b><span>'+escapeHtml(p.meaning)+'</span>'+(editable?'<button data-del-pin="'+p.id+'" class="btn-danger-text">'+t('annotate_delete')+'</button>':'')+'</li>';
              }).join('') : '<li class="empty">'+t('annotate_empty')+'</li>')+
            '</ul></div>'+
            '<div><h4>'+t('annotate_relations_heading',{n:localRelations.length})+'</h4><ul class="rec-list">'+
              (localRelations.length ? localRelations.map(function(r){
                var a = localPins.filter(function(p){return p.id===r.fromPinId;})[0];
                var b = localPins.filter(function(p){return p.id===r.toPinId;})[0];
                return '<li><b>'+escapeHtml(a?a.name:'?')+' → '+escapeHtml(b?b.name:'?')+'</b><span>'+escapeHtml(r.meaning)+'</span>'+(editable?'<button data-del-rel="'+r.id+'" class="btn-danger-text">'+t('annotate_delete')+'</button>':'')+'</li>';
              }).join('') : '<li class="empty">'+t('annotate_empty')+'</li>')+
            '</ul></div>'+
          '</div>'+
          '<div class="modal-foot"><button type="button" class="btn btn-primary" data-done>'+t('annotate_done')+'</button></div>'+
        '</div>';
      wire();
    }

    function commit(){ cfg.onChange && cfg.onChange(localPins, localRelations); }

    function wire(){
      ov.querySelector('[data-x]').onclick = close;
      ov.querySelector('[data-done]').onclick = close;
      if(editable){
        var mp = ov.querySelector('[data-mode="pin"]'); if(mp) mp.onclick = function(){ mode='pin'; relFirstId=null; render(); };
        var mr = ov.querySelector('[data-mode="relation"]'); if(mr) mr.onclick = function(){ mode='relation'; relFirstId=null; render(); };
        var mv = ov.querySelector('[data-mode="view"]'); if(mv) mv.onclick = function(){ mode='view'; relFirstId=null; render(); };
        Array.prototype.forEach.call(ov.querySelectorAll('[data-del-pin]'), function(b){
          b.onclick = function(){
            var id = b.getAttribute('data-del-pin');
            localPins = localPins.filter(function(p){ return p.id!==id; });
            localRelations = localRelations.filter(function(r){ return r.fromPinId!==id && r.toPinId!==id; });
            commit(); render();
          };
        });
        Array.prototype.forEach.call(ov.querySelectorAll('[data-del-rel]'), function(b){
          b.onclick = function(){
            var id = b.getAttribute('data-del-rel');
            localRelations = localRelations.filter(function(r){ return r.id!==id; });
            commit(); render();
          };
        });
        var stage = ov.querySelector('[data-stage]');
        stage.addEventListener('click', onStageClick);
      } else {
        Array.prototype.forEach.call(ov.querySelectorAll('.pin-marker'), function(btn){
          btn.onclick = function(){
            var p = localPins.filter(function(pp){ return pp.id === btn.getAttribute('data-pin-id'); })[0];
            if(p) openFormDialog({title:p.name, readonly:true, fields:[{key:'meaning', label:t('field_meaning'), type:'textarea', value:p.meaning}]});
          };
        });
        Array.prototype.forEach.call(ov.querySelectorAll('.rel-line'), function(line){
          line.onclick = function(){
            var r = localRelations.filter(function(rr){ return rr.id === line.getAttribute('data-rel-id'); })[0];
            if(r) openFormDialog({title:t('dialog_relation_title'), readonly:true, fields:[{key:'meaning', label:t('field_relation_meaning'), type:'textarea', value:r.meaning}]});
          };
        });
      }
    }

    function onStageClick(e){
      var markerBtn = e.target.closest('.pin-marker');
      if(mode === 'pin'){
        if(markerBtn){
          var p = localPins.filter(function(pp){ return pp.id === markerBtn.getAttribute('data-pin-id'); })[0];
          if(p) openFormDialog({
            title:t('dialog_edit_part'),
            fields:[{key:'name', label:t('field_part_name'), value:p.name},{key:'meaning', label:t('field_part_meaning'), type:'textarea', value:p.meaning}],
            onSubmit:function(vals){ if(!vals.name.trim()) return; p.name=vals.name.trim(); p.meaning=vals.meaning.trim(); commit(); render(); }
          });
        } else {
          var rect = e.currentTarget.getBoundingClientRect();
          var x = Math.min(100, Math.max(0, (e.clientX-rect.left)/rect.width*100));
          var y = Math.min(100, Math.max(0, (e.clientY-rect.top)/rect.height*100));
          openFormDialog({
            title:t('dialog_new_part'),
            fields:[{key:'name', label:t('field_part_name')},{key:'meaning', label:t('field_part_meaning'), type:'textarea'}],
            onSubmit:function(vals){ if(!vals.name.trim()) return; localPins.push({id:uid(), x:x, y:y, name:vals.name.trim(), meaning:vals.meaning.trim()}); commit(); render(); }
          });
        }
      } else if(mode === 'relation'){
        if(!markerBtn) return;
        var id = markerBtn.getAttribute('data-pin-id');
        if(!relFirstId){ relFirstId = id; render(); }
        else if(relFirstId === id){ relFirstId = null; render(); }
        else {
          var fromId = relFirstId, toId = id;
          relFirstId = null;
          openFormDialog({
            title:t('dialog_new_relation'),
            fields:[{key:'meaning', label:t('field_relation_meaning'), type:'textarea'}],
            onSubmit:function(vals){ localRelations.push({id:uid(), fromPinId:fromId, toPinId:toId, meaning:vals.meaning.trim()}); commit(); render(); }
          });
          render();
        }
      }
    }

    function close(){ ov.remove(); cfg.onClose && cfg.onClose(); }

  /* ---------- rendering: 特別な記録(登録数の推移グラフ) ---------- */
  /** 自分の記録を日付順に積み上げ、[{date, count, real}] の累積系列を作る。
   * realはその日の実際の登録を表す点。最後の登録日が今日より前なら、
   * 今日時点まで線を伸ばすための点(real:false)を末尾に足す。 */
  function buildCumulativeSeries(){
    var own = modelsList.filter(function(m){ return m.isMine; });
    var byDate = {};
    own.forEach(function(m){
      var d = String(m.date||'').slice(0,10);
      if(!d) return;
      byDate[d] = (byDate[d]||0) + 1;
    });
    var dates = Object.keys(byDate).sort();
    var running = 0;
    var points = dates.map(function(d){ running += byDate[d]; return {date:d, count:running, real:true}; });
    var today = todayStr();
    if(points.length && points[points.length-1].date < today){
      points.push({date:today, count:points[points.length-1].count, real:false});
    }
    return points;
  }
  /** 目盛りの間隔として見やすい数(1,2,5×10^nのいずれか)を選ぶ。 */
  function niceStep(roughStep){
    if(roughStep <= 0) return 1;
    var pow10 = Math.pow(10, Math.floor(Math.log(roughStep) / Math.LN10));
    var frac = roughStep / pow10;
    var niceFrac = frac <= 1 ? 1 : (frac <= 2 ? 2 : (frac <= 5 ? 5 : 10));
    return Math.max(1, Math.round(niceFrac * pow10));
  }
  /** 累積個数(縦軸)の最大値から、0を含む適切な目盛り列を作る。 */
  function computeYAxis(maxValue, targetTicks){
    targetTicks = targetTicks || 4;
    maxValue = Math.max(1, maxValue);
    var step = niceStep(maxValue / targetTicks);
    var niceMax = Math.ceil(maxValue / step) * step;
    var ticks = [];
    for(var v = 0; v <= niceMax; v += step) ticks.push(v);
    return {ticks:ticks, max:niceMax};
  }
  /** 記録期間の長さに応じて、日付ラベルの粒度(日/月/年)を切り替える。 */
  function formatChartDate(dateStr, spanDays){
    var parts = dateStr.split('-');
    var y = parts[0], mo = Number(parts[1]), d = parts[2];
    if(spanDays > 730) return lang==='en' ? y : (y+'年');
    if(spanDays > 45) return lang==='en' ? (EN_MONTHS[mo-1].slice(0,3)+' '+y) : (y+'/'+parts[1]);
    return parts[1]+'/'+d;
  }
  function medalChartHtml(){
    var points = buildCumulativeSeries();
    if(points.length === 0){
      return '<div class="card panel medal-chart-card"><h2 class="section-title">'+t('medal_chart_title')+'</h2>'+
        '<div class="medal-chart-empty">'+t('medal_chart_empty')+'</div></div>';
    }
    var W = 640, H = 220, padL = 40, padR = 14, padT = 14, padB = 24;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var minT = new Date(points[0].date+'T00:00:00').getTime();
    var maxT = new Date(points[points.length-1].date+'T00:00:00').getTime();
    var spanDays = Math.round((maxT - minT) / 86400000);
    var yMax = points[points.length-1].count;
    var yAxis = computeYAxis(yMax, 4);
    function xOf(dateStr){
      var t = new Date(dateStr+'T00:00:00').getTime();
      var frac = maxT > minT ? (t - minT) / (maxT - minT) : 0.5;
      return padL + frac * plotW;
    }
    function yOf(count){
      return padT + plotH - (count / yAxis.max) * plotH;
    }
    // 横軸の目盛り: 期間の長さに応じたラベル粒度で、両端を含む均等な位置に立てる
    var xTickCount = spanDays === 0 ? 1 : Math.min(5, points.length);
    var xTicks = [];
    for(var i = 0; i < xTickCount; i++){
      var frac = xTickCount === 1 ? 0 : i / (xTickCount - 1);
      var tMs = minT + frac * (maxT - minT);
      xTicks.push(new Date(tMs));
    }
    var gridSvg = yAxis.ticks.map(function(v){
      var y = yOf(v);
      return '<g class="medal-chart-grid">'+
        '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" />'+
        '<text class="medal-chart-axis-label" x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>'+
      '</g>';
    }).join('');
    var xAxisSvg = xTicks.map(function(dt){
      var iso = dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
      var x = xOf(iso);
      return '<text class="medal-chart-axis-label" x="'+x+'" y="'+(H-6)+'" text-anchor="middle">'+escapeHtml(formatChartDate(iso, spanDays))+'</text>';
    }).join('');
    var linePts = points.map(function(p){ return xOf(p.date)+','+yOf(p.count); });
    var areaPts = [padL+','+yOf(0)].concat(linePts).concat([(padL+plotW)+','+yOf(0)]);
    var dotsSvg = points.filter(function(p){ return p.real; }).map(function(p){
      return '<circle class="medal-chart-dot" cx="'+xOf(p.date)+'" cy="'+yOf(p.count)+'" r="3.5" data-date="'+p.date+'" data-count="'+p.count+'" />';
    }).join('');
    var dataAttr = escapeHtml(JSON.stringify(points));
    var svg = '<svg class="medal-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="'+escapeHtml(t('medal_chart_aria',{n:yMax}))+'" data-points="'+dataAttr+'" '+
      'data-padl="'+padL+'" data-padr="'+padR+'" data-plotw="'+plotW+'" data-mint="'+minT+'" data-maxt="'+maxT+'" data-ymax="'+yAxis.max+'" data-padt="'+padT+'" data-ploth="'+plotH+'">'+
      gridSvg + xAxisSvg +
      '<polygon class="medal-chart-area" points="'+areaPts.join(' ')+'" />'+
      '<polyline class="medal-chart-line" points="'+linePts.join(' ')+'" />'+
      dotsSvg +
      '<line class="medal-chart-crosshair" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+plotH)+'" />'+
      '<circle class="medal-chart-hoverdot" r="4.5" />'+
      '<rect class="medal-chart-hitrect" x="'+padL+'" y="'+padT+'" width="'+plotW+'" height="'+plotH+'" />'+
    '</svg>';
    return '<div class="card panel medal-chart-card stack">'+
      '<div class="medal-chart-head"><h2 class="section-title" style="margin:0;">'+t('medal_chart_title')+'</h2>'+
      '<span class="medal-chart-total">'+t('medal_chart_axis_hint',{n:yMax})+'</span></div>'+
      '<div class="medal-chart-wrap">'+svg+'<div class="medal-chart-tooltip"></div></div>'+
    '</div>';
  }
  /** グラフ上でのマウス移動に応じて、最も近い記録日のツールチップと十字線を表示する。 */
  function afterMedalsRender(){
    var svg = document.querySelector('.medal-chart-svg');
    if(!svg) return;
    var points = JSON.parse(svg.getAttribute('data-points'));
    var padL = Number(svg.getAttribute('data-padl'));
    var plotW = Number(svg.getAttribute('data-plotw'));
    var minT = Number(svg.getAttribute('data-mint'));
    var maxT = Number(svg.getAttribute('data-maxt'));
    var crosshair = svg.querySelector('.medal-chart-crosshair');
    var hoverDot = svg.querySelector('.medal-chart-hoverdot');
    var hitRect = svg.querySelector('.medal-chart-hitrect');
    var tooltip = document.querySelector('.medal-chart-tooltip');
    var wrap = document.querySelector('.medal-chart-wrap');
    if(!hitRect || !tooltip || !wrap) return;
    function xOf(dateStr){
      var t = new Date(dateStr+'T00:00:00').getTime();
      var frac = maxT > minT ? (t - minT) / (maxT - minT) : 0.5;
      return padL + frac * plotW;
    }
    function nearestPoint(pxFrac){
      var tMs = minT + pxFrac * (maxT - minT);
      var best = points[0], bestDiff = Infinity;
      points.forEach(function(p){
        var pt = new Date(p.date+'T00:00:00').getTime();
        var diff = Math.abs(pt - tMs);
        if(diff < bestDiff){ bestDiff = diff; best = p; }
      });
      return best;
    }
    function show(clientX){
      var rect = svg.getBoundingClientRect();
      var scale = svg.viewBox.baseVal.width / rect.width;
      var svgX = (clientX - rect.left) * scale;
      var pxFrac = Math.max(0, Math.min(1, (svgX - padL) / plotW));
      var p = nearestPoint(pxFrac);
      var x = xOf(p.date);
      // yはSVGにすでに描かれたドット要素のcy値から取得する(実点がある場合)
      var dotEl = svg.querySelector('circle.medal-chart-dot[data-date="'+p.date+'"]');
      var yPix = dotEl ? Number(dotEl.getAttribute('cy')) : null;
      if(yPix === null){
        // real:falseの補間点(今日まで延長した点)はドットが無いため、直前の実点と同じ高さを使う
        var lastReal = points.filter(function(pp){ return pp.real; }).pop();
        var lastDotEl = svg.querySelector('circle.medal-chart-dot[data-date="'+lastReal.date+'"]');
        yPix = lastDotEl ? Number(lastDotEl.getAttribute('cy')) : 0;
      }
      crosshair.setAttribute('x1', x); crosshair.setAttribute('x2', x);
      crosshair.style.opacity = 1;
      hoverDot.setAttribute('cx', x); hoverDot.setAttribute('cy', yPix);
      hoverDot.style.opacity = 1;
      var wrapRect = wrap.getBoundingClientRect();
      var svgRect = svg.getBoundingClientRect();
      var tipLeft = (x / svg.viewBox.baseVal.width) * svgRect.width + (svgRect.left - wrapRect.left);
      var tipTop = (yPix / svg.viewBox.baseVal.height) * svgRect.height + (svgRect.top - wrapRect.top);
      tooltip.style.left = tipLeft + 'px';
      tooltip.style.top = (tipTop - 8) + 'px';
      tooltip.textContent = p.date + '  ' + (lang==='en' ? p.count : (p.count+'個'));
      tooltip.style.opacity = 1;
    }
    function hide(){
      crosshair.style.opacity = 0;
      hoverDot.style.opacity = 0;
      tooltip.style.opacity = 0;
    }
    hitRect.addEventListener('mousemove', function(e){ show(e.clientX); });
    hitRect.addEventListener('mouseleave', hide);
    hitRect.addEventListener('touchstart', function(e){ if(e.touches[0]) show(e.touches[0].clientX); }, {passive:true});
    hitRect.addEventListener('touchmove', function(e){ if(e.touches[0]) show(e.touches[0].clientX); }, {passive:true});
    hitRect.addEventListener('touchend', hide);
  }

  function afterNewRender(){
    var titleEl = document.getElementById('f-title'); if(titleEl) titleEl.oninput = function(e){ draft.title = e.target.value; };
    var dt = document.getElementById('f-date'); if(dt) dt.oninput = function(e){ draft.date = e.target.value; };
    var pl = document.getElementById('f-place'); if(pl) pl.oninput = function(e){ draft.place = e.target.value; };
    var nt = document.getElementById('f-noticed'); if(nt) nt.oninput = function(e){ draft.noticed = e.target.value; };
    var st = document.getElementById('f-story'); if(st) st.oninput = function(e){ draft.story = e.target.value; };
    var ispub = document.getElementById('f-ispublic'); if(ispub) ispub.onchange = function(e){ draft.isPublic = e.target.checked; };
    Array.prototype.forEach.call(document.querySelectorAll('.action-row-input'), function(el){
      el.oninput = function(e){ draft.actions[Number(el.getAttribute('data-idx'))] = e.target.value; };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.slot-label-input'), function(el){
      el.oninput = function(e){
        var key = el.getAttribute('data-slot');
        if(!draft.photos[key]) draft.photos[key] = {label:'', assetId:null, previewUrl:null, pins:[], relations:[]};
        draft.photos[key].label = e.target.value;
      };
    });
    slotsForMode(draft.recordMode).forEach(function(slot){
      var input = document.getElementById('file-'+slot.key);
      if(!input) return;
      input.onchange = function(e){
        var file = e.target.files[0];
        if(!file) return;
        formError = '';
        apiUploadImage(file).then(function(res){
          var existingLabel = (draft.photos[slot.key] && draft.photos[slot.key].label) || '';
          draft.photos[slot.key] = {assetId:res.id, previewUrl:res.url, pins:[], relations:[], label:existingLabel};
          renderView();
        }).catch(function(err){
          formError = t('err_photo_upload_failed',{msg:serverMsg(err.message)});
          renderView();
        });
      };
    });
    var videoInput = document.getElementById('file-video');
    if(videoInput){
      videoInput.onchange = function(e){
        var file = e.target.files[0];
        if(!file) return;
        if(file.size > VIDEO_MAX_BYTES){
          formError = t('err_video_too_large');
          renderView();
          return;
        }
        formError = '';
        var localPreview = URL.createObjectURL(file);
        draft.video = {assetId:null, previewUrl:localPreview, uploading:true};
        renderView();
        apiUploadImage(file).then(function(res){
          if(!draft.video) return; // 直後に削除された場合は無視
          draft.video.assetId = res.id;
          draft.video.uploading = false;
          renderView();
        }).catch(function(err){
          draft.video = null;
          formError = t('err_video_upload_failed',{msg:serverMsg(err.message)});
          renderView();
        });
      };
    }
  }

  async function doSaveNewModel(){
    var title = draft.title.trim();
    var date = draft.date;
    var isVideo = draft.recordMode === 'video';
    var modeSlots = slotsForMode(draft.recordMode);
    var hasContent = isVideo
      ? !!(draft.video && draft.video.assetId)
      : modeSlots.some(function(s){ return draft.photos[s.key] && draft.photos[s.key].assetId; });
    if(!title){ formError=t('err_title_required'); renderView(); return; }
    if(!date){ formError=t('err_date_required'); renderView(); return; }
    if(!hasContent){ formError = isVideo ? t('err_video_required') : t('err_photo_required'); renderView(); return; }
    formError=''; saving=true; renderView();
    try{
      var coverAssetId = '';
      if(isVideo){
        coverAssetId = draft.video.assetId;
      } else {
        var coverSlot = modeSlots.filter(function(s){ return draft.photos[s.key] && draft.photos[s.key].assetId; })[0];
        coverAssetId = coverSlot ? draft.photos[coverSlot.key].assetId : '';
      }
      var modelRes = await apiCall('createModel', {model:{
        title:title, date:date, place:draft.place.trim(), noticed:draft.noticed.trim(),
        story:draft.story.trim(), coverAssetId: coverAssetId, isPublic: draft.isPublic !== false,
        theme: draft.theme || '', recordMode: draft.recordMode, videoAssetId: isVideo ? draft.video.assetId : ''
      }});
      var modelId = modelRes.id;
      var writes = [];
      if(!isVideo){
        modeSlots.forEach(function(s){
          var p = draft.photos[s.key];
          if(!p || !p.assetId) return;
          writes.push(apiCall('createPhoto', {photo:{
            modelId:modelId, slot:s.key, assetId:p.assetId, pins:p.pins||[], relations:p.relations||[], label:p.label||''
          }}));
        });
      }
      draft.actions.filter(function(a){ return a.trim(); }).forEach(function(text){
        writes.push(apiCall('createAction', {actionItem:{
          modelId:modelId, modelTitle:title, text:text.trim(), registeredAt:date, checks:computeChecks(date)
        }}));
      });
      await Promise.all(writes);
      draft = freshDraft();
      saving = false;
      currentView = 'detail'; currentDetailId = modelId;
      await refreshData(true);
      if(modelRes.newMedals && modelRes.newMedals.length){
        showMedalCelebration(modelRes.newMedals[0]);
      }
    }catch(e){
      console.error(e);
      saving = false;
      formError = t('err_save_failed',{msg:serverMsg(e.message)});
      renderView();
    }
  }

  /* ---------- rendering: detail ---------- */
  function photoStageInnerHtml(photoDoc){
    var pins = photoDoc.pins || [], relations = photoDoc.relations || [];
    var pinsHtml = pinsVisible ? pins.map(function(p){
      return '<button type="button" class="pin-marker" data-pin-id="'+p.id+'" style="left:'+p.x+'%;top:'+p.y+'%" title="'+escapeHtml(p.name)+'"><span class="pin-dot"></span></button>';
    }).join('') : '';
    var linesHtml = pinsVisible ? relations.map(function(r){
      var a = pins.filter(function(p){return p.id===r.fromPinId;})[0];
      var b = pins.filter(function(p){return p.id===r.toPinId;})[0];
      if(!a||!b) return '';
      return '<line class="rel-line" data-rel-id="'+r.id+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" marker-end="url(#arrow-d-'+photoDoc.slot+')"></line>';
    }).join('') : '';
    var defs = '<defs><marker id="arrow-d-'+photoDoc.slot+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs>';
    var pinsAttr = escapeHtml(JSON.stringify(pins));
    var relsAttr = escapeHtml(JSON.stringify(relations));
    var slotLabel = resolveSlotLabel(photoDoc);
    return '<div class="photo-stage" data-readonly data-pins="'+pinsAttr+'" data-relations="'+relsAttr+'">'+
        '<img src="'+blobUrl(photoDoc.assetId)+'" alt="'+escapeHtml(slotLabel)+'" />'+
        '<div class="pin-layer">'+pinsHtml+'</div>'+
        '<svg class="arrow-layer" viewBox="0 0 100 100" preserveAspectRatio="none">'+defs+linesHtml+'</svg>'+
      '</div>';
  }
  function cubeHtml(m, photos){
    var byKey = {};
    photos.forEach(function(p){ byKey[p.slot] = p; });
    function face(slotKey, cls){
      var slotLabel = fixedSlotLabel(slotKey);
      var p = byKey[slotKey];
      var inner = p ? photoStageInnerHtml(p) : '<div class="cube-face-empty">'+escapeHtml(slotLabel)+'<br>'+t('cube_unphotographed')+'</div>';
      return '<div class="cube-face '+cls+'"><span class="cube-face-label">'+escapeHtml(slotLabel)+'</span>'+inner+'</div>';
    }
    return '<div class="cube-wrap">'+
      '<div class="cube-scene" data-cube>'+
        '<div class="cube" data-cube-inner>'+
          face('front','face-front')+face('back','face-back')+face('right','face-right')+face('left','face-left')+face('top','face-top')+
        '</div>'+
      '</div>'+
      '<p class="cube-hint">'+t('cube_hint')+'</p>'+
    '</div>';
  }

  function wireCube(){
    var scene = document.querySelector('[data-cube]');
    if(!scene) return;
    var inner = scene.querySelector('[data-cube-inner]');
    var state = {rx:-16, ry:-30};
    inner.style.transform = 'rotateX('+state.rx+'deg) rotateY('+state.ry+'deg)';
    var dragging = false, moved = false, lastX = 0, lastY = 0;
    function pos(e){ return {x:e.clientX, y:e.clientY}; }
    function onDown(e){ dragging = true; moved = false; var p = pos(e); lastX = p.x; lastY = p.y; }
    function onMove(e){
      if(!dragging) return;
      var p = pos(e);
      var dx = p.x - lastX, dy = p.y - lastY;
      if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      lastX = p.x; lastY = p.y;
      state.ry += dx * 0.4;
      state.rx -= dy * 0.4;
      state.rx = Math.max(-89, Math.min(89, state.rx));
      inner.style.transform = 'rotateX('+state.rx+'deg) rotateY('+state.ry+'deg)';
      if(moved) e.preventDefault();
    }
    function onUp(){
      if(dragging && moved){
        var blocker = function(ev){ ev.stopPropagation(); };
        document.addEventListener('click', blocker, {capture:true, once:true});
      }
      dragging = false;
    }
    scene.addEventListener('pointerdown', onDown);
    scene.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  function afterDetailRender(){
    var toggle = document.getElementById('pinToggle');
    if(toggle) toggle.onchange = function(){ pinsVisible = toggle.checked; renderView(); };
    wireCube();
    Array.prototype.forEach.call(document.querySelectorAll('.photo-stage[data-readonly]'), function(stage){
      var pins = [], rels = [];
      try{ pins = JSON.parse(stage.getAttribute('data-pins')); }catch(e){}
      try{ rels = JSON.parse(stage.getAttribute('data-relations')); }catch(e){}
      Array.prototype.forEach.call(stage.querySelectorAll('.pin-marker'), function(btn){
        btn.onclick = function(){
          var pin = pins.filter(function(p){ return p.id===btn.getAttribute('data-pin-id'); })[0];
          if(pin) openFormDialog({title:pin.name, readonly:true, fields:[{key:'meaning', label:t('field_meaning'), type:'textarea', value:pin.meaning}]});
        };
      });
      Array.prototype.forEach.call(stage.querySelectorAll('.rel-line'), function(line){
        line.onclick = function(){
          var rel = rels.filter(function(r){ return r.id===line.getAttribute('data-rel-id'); })[0];
          if(rel) openFormDialog({title:t('dialog_relation_title'), readonly:true, fields:[{key:'meaning', label:t('field_relation_meaning'), type:'textarea', value:rel.meaning}]});
        };
      });
    });
  }

  /* ---------- rendering: checks dashboard ---------- */
  function viewChecksHtml(){
    var due = [];
    actionsList.forEach(function(a){ dueChecksFor(a).forEach(function(d){ due.push({action:a, key:d.key, due:d.due}); }); });
    due.sort(function(x,y){ return x.due < y.due ? -1 : 1; });

    var upcoming = [];
    actionsList.forEach(function(a){
      if(a.stopped) return;
      var next = CHECK_ORDER.filter(function(k){ return !a.checks[k].done; })[0];
      if(next && a.checks[next].due > todayStr()) upcoming.push({action:a, key:next, due:a.checks[next].due});
    });
    upcoming.sort(function(x,y){ return x.due < y.due ? -1 : 1; });
    upcoming = upcoming.slice(0,8);

    var html = '<div class="stack">';
    html += '<div class="card panel stack"><h2 class="section-title">'+t('checks_due_title',{n:due.length})+'</h2>';
    if(due.length===0){ html += '<p class="section-hint">'+t('checks_due_empty')+'</p>'; }
    due.forEach(function(d){
      html += '<div class="due-item"><div class="info"><b>'+escapeHtml(d.action.modelTitle)+'</b>'+escapeHtml(d.action.text)+' ・ '+checkLabel(d.key)+t('checks_due_date_label',{date:d.due})+'</div>'+
        '<button class="btn btn-primary" data-action="open-check" data-action-id="'+d.action.id+'" data-key="'+d.key+'">'+t('check_record_btn')+'</button>'+
      '</div>';
    });
    html += '</div>';

    html += '<div class="card panel stack"><h2 class="section-title">'+t('checks_upcoming_title')+'</h2>';
    if(upcoming.length===0){ html += '<p class="section-hint">'+t('checks_upcoming_empty')+'</p>'; }
    upcoming.forEach(function(u){
      html += '<div class="upcoming-item"><span>'+escapeHtml(u.action.modelTitle)+' ・ '+escapeHtml(u.action.text)+'</span><span>'+checkLabel(u.key)+t('checks_upcoming_date_label',{date:u.due})+'</span></div>';
    });
    html += '</div></div>';
    return html;
  }

  /* ---------- view dispatch ---------- */
  function renderView(){
    var el = document.getElementById('view');
    if(!session || authMode==='reset'){
      document.getElementById('tabs').innerHTML = '';
      document.getElementById('syncNote').textContent = '';
      document.getElementById('globalNotice').innerHTML = API_URL ? '' : '<div class="notice">'+t('notice_api_url_missing')+'</div>';
      el.innerHTML = authHtml();
      afterAuthRender();
      updateUserBar();
      return;
    }
    if(currentView==='month'){ el.innerHTML = viewMonthHtml(); }
    else if(currentView==='list'){ el.innerHTML = viewListHtml(); }
    else if(currentView==='new'){ el.innerHTML = viewNewHtml(); afterNewRender(); }
    else if(currentView==='theme'){ el.innerHTML = viewThemeHtml(); }
    else if(currentView==='detail'){ el.innerHTML = viewDetailHtml(); afterDetailRender(); }
    else if(currentView==='checks'){ el.innerHTML = viewChecksHtml(); }
    else if(currentView==='medals'){ el.innerHTML = viewMedalsHtml(); afterMedalsRender(); }
    renderNav();
    updateUserBar();
  }
  function renderApp(){ if(session) renderNav(); renderView(); }

  /* ---------- delegated click handling ---------- */
  document.getElementById('shell').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    if(action==='auth-mode'){ authMode = el.getAttribute('data-mode'); authError=''; authSuccess=''; renderApp(); }
    else if(action==='do-login'){ doLogin(); }
    else if(action==='do-register'){ doRegister(); }
    else if(action==='do-request-reset'){ doRequestPasswordReset(); }
    else if(action==='do-reset-password'){ doResetPassword(); }
    else if(action==='logout'){ doLogout(); }
    else if(action==='nav'){ currentView = el.getAttribute('data-view'); formError=''; renderApp(); }
    else if(action==='open-detail'){ currentView='detail'; currentDetailId = el.getAttribute('data-id'); renderApp(); }
    else if(action==='open-month'){ monthYear=Number(el.getAttribute('data-year')); monthMonth=Number(el.getAttribute('data-month')); currentView='month'; renderApp(); }
    else if(action==='month-prev'){ monthMonth--; if(monthMonth<0){monthMonth=11; monthYear--;} renderView(); }
    else if(action==='month-next'){ monthMonth++; if(monthMonth>11){monthMonth=0; monthYear++;} renderView(); }
    else if(action==='delete-model'){ deleteConfirmId = el.getAttribute('data-id'); renderView(); }
    else if(action==='delete-model-cancel'){ deleteConfirmId = null; renderView(); }
    else if(action==='delete-model-confirm'){ doDeleteModel(el.getAttribute('data-id')); }
    else if(action==='set-record-mode'){
      var newMode = el.getAttribute('data-mode');
      if(newMode !== draft.recordMode){
        draft.recordMode = newMode;
        draft.photos = initialPhotosForMode(newMode);
        draft.video = null;
        formError = '';
      }
      renderView();
    }
    else if(action==='photo-upload-slot'){ var inp=document.getElementById('file-'+el.getAttribute('data-slot')); if(inp) inp.click(); }
    else if(action==='photo-remove'){
      var removeKey = el.getAttribute('data-slot');
      var slotDef = slotsForMode(draft.recordMode).filter(function(s){ return s.key===removeKey; })[0];
      if(slotDef && slotDef.editableLabel){
        var existingLabel = (draft.photos[removeKey] && draft.photos[removeKey].label) || '';
        draft.photos[removeKey] = {label:existingLabel, assetId:null, previewUrl:null, pins:[], relations:[]};
      } else {
        draft.photos[removeKey] = null;
      }
      renderView();
    }
    else if(action==='video-upload-slot'){ var vinp=document.getElementById('file-video'); if(vinp) vinp.click(); }
    else if(action==='video-remove'){ draft.video = null; renderView(); }
    else if(action==='annotate-open'){ openAnnotateForSlot(el.getAttribute('data-slot'), el.getAttribute('data-mode'), el.getAttribute('data-model-id')); }
    else if(action==='action-add-row'){ draft.actions.push(''); renderView(); }
    else if(action==='action-remove-row'){ var idx=Number(el.getAttribute('data-idx')); draft.actions.splice(idx,1); if(draft.actions.length===0) draft.actions.push(''); renderView(); }
    else if(action==='save-new-model'){ doSaveNewModel(); }
    else if(action==='theme-draw'){
      var pool = themesList.length ? themesList.map(function(t){ return t.text; }) : THEME_FALLBACK;
      currentTheme = pool[Math.floor(Math.random()*pool.length)];
      renderView();
    }
    else if(action==='theme-start-record'){ draft = freshDraft(); draft.theme = currentTheme; draft.title = currentTheme; currentView='new'; renderApp(); }
    else if(action==='theme-edit-start'){ editingThemeId = el.getAttribute('data-id'); themeAdminError=''; renderView(); }
    else if(action==='theme-cancel-edit'){ editingThemeId = null; themeAdminError=''; renderView(); }
    else if(action==='theme-save-edit'){ doSaveThemeEdit(el.getAttribute('data-id')); }
    else if(action==='theme-delete'){ doDeleteTheme(el.getAttribute('data-id')); }
    else if(action==='theme-add'){ doAddTheme(); }
    else if(action==='open-check'){ openCheckForm(el.getAttribute('data-action-id'), el.getAttribute('data-key')); }
    else if(action==='toggle-lang'){ setLang(lang==='ja' ? 'en' : 'ja'); }
  });

  /* ---------- init ---------- */
  applyStaticText();
  renderApp();
  if(session){
    refreshData(false);
    setInterval(function(){ if(session) refreshData(true); }, POLL_INTERVAL_MS);
  }
})();
</script>
